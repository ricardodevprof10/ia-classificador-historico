
name: Auditoria automatizada de vieses

on:
  workflow_dispatch:

  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write

concurrency:
  group: auditoria-vieses
  cancel-in-progress: false

jobs:
  auditoria:
    name: Executar auditoria de IA
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-auditoria.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26,<3" \
            "scikit-learn>=1.5,<2"

      - name: Executar auditoria
        run: |
          python auditoria/auditoria_vieses.py

      - name: Validar relatório
        run: |
          python -m json.tool \
            relatorios/relatorio_auditoria_vieses.json \
            > /dev/null

      - name: Publicar relatório como artefato
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-auditoria-vieses
          path: relatorios/relatorio_auditoria_vieses.json
          retention-days: 30

      - name: Publicar relatório no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add relatorios/relatorio_auditoria_vieses.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no relatório."
          else
            git commit -m "Atualizar relatório de auditoria de vieses"
            git push
          fi
