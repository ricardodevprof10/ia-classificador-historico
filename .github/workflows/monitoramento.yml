
name: Monitoramento de IA

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  monitorar:
    name: Executar monitoramento
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.txt

      - name: Executar testes
        run: |
          python -m pytest -v

      - name: Executar monitoramento
        run: |
          python monitoramento.py

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-monitoramento-ia
          path: relatorios/relatorio_monitoramento.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verificar alerta
        run: |
          python - <<'PY'
          import json
          import os

          with open(
              "relatorios/relatorio_monitoramento.json",
              encoding="utf-8"
          ) as arquivo:
              relatorio = json.load(arquivo)

          psi = relatorio["psi"]
          alerta = relatorio["alerta"]

          resumo = os.environ.get("GITHUB_STEP_SUMMARY")

          mensagem = (
              f"## Monitoramento de IA\n\n"
              f"- PSI: {psi}\n"
              f"- Alerta: {alerta}\n"
          )

          print(mensagem)

          if resumo:
              with open(
                  resumo,
                  "a",
                  encoding="utf-8"
              ) as arquivo:
                  arquivo.write(mensagem)

          if alerta:
              print(
                  "::warning::Mudança expressiva "
                  "na distribuição das previsões."
              )
          PY
