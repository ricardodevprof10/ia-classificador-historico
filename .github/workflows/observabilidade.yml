
name: Observabilidade de IA

on:
  workflow_dispatch:

  schedule:
    - cron: "30 12 * * 1"

permissions:
  contents: write

concurrency:
  group: observabilidade-ia
  cancel-in-progress: false

jobs:
  observabilidade:
    name: Analisar saude operacional
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt

      - name: Executar testes
        run: |
          python -m pytest -v

      - name: Executar observabilidade
        run: |
          python observabilidade.py

      - name: Publicar resultados no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add relatorios/metricas_observabilidade.json
          git add relatorios/logs_observabilidade.jsonl

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao encontrada."
          else
            git commit -m "Atualizar observabilidade de IA"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Armazenar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observabilidade-ia
          path: |
            relatorios/metricas_observabilidade.json
            relatorios/logs_observabilidade.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Verificar alertas
        run: |
          python - <<'PY'
          import json
          import os

          caminho = "relatorios/metricas_observabilidade.json"

          with open(caminho, encoding="utf-8") as f:
              metricas = json.load(f)

          resumo = (
              "## Observabilidade de IA\n\n"
              f"- Requisicoes: {metricas['total_requisicoes']}\n"
              f"- Erros: {metricas['erros']}\n"
              f"- Taxa de erros: {metricas['taxa_erros_pct']}%\n"
              f"- Latencia P95: {metricas['latencia_p95_ms']} ms\n"
              f"- Alerta: {metricas['alerta']}\n"
          )

          print(resumo)

          arquivo_resumo = os.environ.get("GITHUB_STEP_SUMMARY")

          if arquivo_resumo:
              with open(arquivo_resumo, "a", encoding="utf-8") as f:
                  f.write(resumo)

          for alerta in metricas["alertas"]:
              print(
                  "::warning::"
                  + alerta["mensagem"]
              )
          PY
